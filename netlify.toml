# Netlify build configuration for the GCE static site.
# Publishing is triggered manually by the repo owner — see README.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static-site security & caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Astro fingerprints hashed assets — safe to cache aggressively.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Link-preview images (scripts/share-images.mjs). Their names carry a hash of
# the source photo, so a new photo gets a new URL; cached for a week rather than
# forever in case the drawing changes without a RECIPE bump in src/lib/og.ts.
# Netlify serves them as image/jpeg from the extension; nothing blocks crawlers.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pages that moved. 301s keep old links and search results working.
[[redirects]]
  from = "/programs/course-outlines"
  to = "/course-outlines"
  status = 301

# Academics left Student Life for its own section; old links still arrive.
[[redirects]]
  from = "/student-life/teaching-practice"
  to = "/academics/teaching-practice"
  status = 301

[[redirects]]
  from = "/student-life/internal-exams"
  to = "/academics/internal-exams"
  status = 301

[[redirects]]
  from = "/student-life/cr-elections"
  to = "/academics/cr-elections"
  status = 301

[[redirects]]
  from = "/student-life/magazine"
  to = "/academics/magazine"
  status = 301
